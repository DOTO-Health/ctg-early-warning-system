name: CI

# Runs its `build` workflow as a required
# check on every PR — one workflow, scoped per workspace, no separate
# pipelines to keep in sync as the project grows.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Classification engine (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build --workspace=packages/core
      - name: Test with coverage
        run: npm run test:cov --workspace=packages/core
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./packages/core/coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Classification engine coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["lines", "statements", "branches", "functions"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

  api:
    name: API (lint + build + e2e)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # api depends on the compiled core package
      - run: npm run build --workspace=packages/core
      - name: Lint
        run: npm run lint --workspace=apps/api
      - name: Build
        run: npm run build --workspace=apps/api
      - name: e2e tests with coverage
        run: npm run test:e2e:cov --workspace=apps/api
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./apps/api/coverage-e2e/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### API e2e coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["lines", "statements", "branches", "functions"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web UI (Tailwind build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Catches broken markup/@theme config
      # precompile step would — build failure = PR failure, not a runtime
      # surprise after merge.
      - name: Build Tailwind CSS
        run: npm run build:css --workspace=apps/web